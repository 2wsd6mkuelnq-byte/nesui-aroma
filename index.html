<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今のあなたに必要な香り診断 | NESUI -aroma & yoga-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9f9;--card:#fff;--ink:#264846;--sub:#5f7b79;--line:#d3e5e4;--main:#3d8c8b;--main-d:#2c7273;--soft:#e7f3f2;--warn:#fff6e6;--warnink:#6b4a12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201e;--card:#183029;--ink:#e6f3ef;--sub:#9db9b1;--line:#2c4a43;--main:#5cc2b3;--main-d:#8ad8cb;--soft:#1f3f38;--warn:#3a3020;--warnink:#f0d9a8}}
:root[data-theme="dark"]{--bg:#10201e;--card:#183029;--ink:#e6f3ef;--sub:#9db9b1;--line:#2c4a43;--main:#5cc2b3;--main-d:#8ad8cb;--soft:#1f3f38;--warn:#3a3020;--warnink:#f0d9a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8;font-size:16px}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px}
.brand{font-size:13px;color:var(--sub);text-align:center;letter-spacing:.06em}
h1{font-size:26px;line-height:1.5;margin:14px 0 10px;text-align:center;font-weight:700}
h2{font-size:21px;line-height:1.5;margin:0 0 14px;font-weight:700}
p{margin:0 0 12px}
.lead{color:var(--sub);text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-top:18px}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--main);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:14px 18px;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{background:var(--main-d)}
.btn.ghost{background:transparent;color:var(--main-d);border:1.5px solid var(--main);margin-top:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--main-d);outline-offset:2px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--main);border-radius:99px;transition:width .3s}
.count{font-size:13px;color:var(--sub);text-align:right}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;cursor:pointer}
.opt:hover,.opt.on{border-color:var(--main);background:var(--soft)}
.back{background:none;border:0;color:var(--sub);font:inherit;font-size:14px;margin-top:16px;cursor:pointer;padding:6px 0}
.badge{display:inline-block;background:var(--soft);color:var(--main-d);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
.hero{text-align:center}
.hero .mark{font-size:46px;line-height:1.2}
.hero h2{font-size:25px;margin:6px 0 4px}
.catch{color:var(--main-d);font-weight:700;margin-bottom:14px}
.recipe{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;margin:6px 0}.tip2{font-size:12px;color:var(--sub);margin:6px 0 0}.steps{padding-left:1.4em;font-size:15px}.steps li{margin:6px 0}
.oil{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.oic{flex:0 0 56px;height:56px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center}.oic svg{width:44px;height:44px}.oil b{display:block}.oil span{font-size:14px;color:var(--sub)}
.oil b{display:block}
.oil span{font-size:14px;color:var(--sub)}
h3{font-size:16px;margin:20px 0 6px;color:var(--main-d)}
.warn{background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;margin-top:18px}
.sub{border-top:1px solid var(--line);margin-top:20px;padding-top:14px;font-size:15px}
.cta{margin-top:20px;text-align:center;font-size:15px}
.wm{text-align:center;margin-bottom:8px}.wm .mk svg{width:150px;height:auto}.wm .nm{font-family:'Cormorant Garamond','Hiragino Mincho ProN',serif;font-weight:300;letter-spacing:.42em;padding-left:.42em;font-size:34px;line-height:1.3;color:var(--main-d)}.wm .ay{display:flex;align-items:center;justify-content:center;gap:10px;font-size:11px;letter-spacing:.3em;color:var(--main)}.wm .ay i{display:block;width:30px;height:1px;background:var(--main)}.wm.s .nm{font-size:22px}.wm.s .ay{font-size:9px}.mark svg{width:100px;height:auto}.mark{margin:6px 0}
.logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto;mix-blend-mode:multiply}.wm.s .logo{max-width:120px}.mark .logo{max-width:150px}
.pn{font-size:15px;margin:4px 0 8px}.frames{display:flex;gap:8px;justify-content:center}.frames figure{margin:0;flex:1;max-width:320px;text-align:center}.frames svg{width:100%;height:auto;background:var(--soft);border-radius:14px}.frames figcaption{font-size:13px;font-weight:700;color:var(--main-d);margin-top:4px}.steps{padding-left:1.5em;margin:12px 0 6px}.steps li{margin:6px 0;font-size:15px}.tip{font-size:13px;color:var(--sub);background:var(--soft);border-radius:10px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

function oilRow(o){var g=OIL_ICON[o[0]]||ic('<circle cx="24" cy="24" r="12"/>');return '<div class="oil"><div class="oic">'+g+'</div><div><b>'+esc(o[0])+'</b><span>'+esc(o[1])+'</span></div></div>'}
var app = document.getElementById("app");

async function getCap(n){try{return window.claude?await window.claude.use(n):null}catch(e){return null}}
async function saveResult(k){var db=await getCap("db");if(!db)return;try{await db.collection("results").add({type:k,at:new Date().toISOString()})}catch(e){}}
var NAMES_R={E:"元気チャージ",R:"やさしくゆるむ",F:"すっきり切り替え",G:"どっしり安心",S:"ぐっすりおやすみ",H:"自分をいたわる"};
async function showStats(){var box=document.getElementById("stats");var db=await getCap("db");if(!db){box.innerHTML='<p class="tip">集計を表示できませんでした。</p>';return}try{var snap=await db.collection("results").get();var c={};snap.docs.forEach(function(d){var t=(d.data()||{}).type;if(t)c[t]=(c[t]||0)+1});var h='<div class="card"><b>診断の完了数：'+snap.size+'件</b>';Object.keys(NAMES_R).forEach(function(k){h+='<div class="oil"><div><b>'+NAMES_R[k]+'</b></div><span>'+(c[k]||0)+'件</span></div>'});box.innerHTML=h+'</div>'}catch(e){box.innerHTML='<p class="tip">集計を読み込めませんでした。</p>'}}
async function ownerLink(own){var u=await getCap("user");if(u&&(await u.isOwner())){own.innerHTML='<div id="stats"></div><button class="back" id="sb">（オーナー用）診断の集計を見る</button>';document.getElementById("sb").onclick=showStats}}
var step = -1, ans = [];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function start(){
  step=-1; ans=[];
  app.innerHTML =
  '<div class="hero">'+WM(1)+'</div>'+
  '<h1>今のあなたに必要な香り診断</h1>'+
  '<p class="lead">7つの質問に直感で答えるだけ。<br>いまの心と体にそっと寄りそう香りと、使い方をお伝えします。</p>'+
  '<div class="card"><p>所要時間は約1分。正解はないので、パッと浮かんだものを選んでくださいね。</p>'+
  '<button class="btn" id="go">診断をはじめる</button></div>'+
  '<p class="warn">※この診断は“いまの心地よさ”の目安です。医療的な診断や治療ではありません。</p>';
  document.getElementById("go").onclick=function(){step=0;render()};
  var own=document.createElement('div');app.appendChild(own);ownerLink(own);
}
function render(){
  if(step>=Q.length){return result()}
  var q=Q[step], pct=Math.round(step/Q.length*100), h='';
  h+='<div class="count">'+(step+1)+' / '+Q.length+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="card"><h2>'+esc(q.q)+'</h2>';
  q.a.forEach(function(o,i){h+='<button class="opt'+(ans[step]===i?' on':'')+'" data-i="'+i+'">'+esc(o[0])+'</button>'});
  h+='</div>';
  if(step>0)h+='<button class="back" id="bk">← ひとつ前にもどる</button>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){
    b.onclick=function(){ans[step]=+b.getAttribute("data-i");step++;render();window.scrollTo(0,0)};
  });
  var bk=document.getElementById("bk");
  if(bk)bk.onclick=function(){step--;render();window.scrollTo(0,0)};
}
function result(){
  var sc={E:0,R:0,F:0,G:0,S:0,H:0}, last={};
  Q.forEach(function(q,i){var w=q.a[ans[i]][1];for(var k in w){sc[k]+=w[k]}if(i===Q.length-1)last=w});
  var keys=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a]||(last[b]||0)-(last[a]||0)});
  var t=T[keys[0]], s=T[keys[1]], gap=sc[keys[1]]>=sc[keys[0]]-1;
  var h='<div class="hero">'+WM(0)+'</div>';
  h+='<div class="card hero"><span class="badge">あなたの今の香りは</span><h2>'+esc(t.n)+'</h2><div class="catch">'+esc(t.c)+'</div></div>';
  h+='<div class="card"><p>'+esc(t.d)+'</p>';
  h+='<h3>おすすめの精油</h3>';
  t.o.forEach(function(o){h+=oilRow(o)});
  h+='<h3>おすすめブレンドレシピ</h3><div class="recipe">'+esc(t.b)+'</div>';
  h+='<p class="tip2">※1滴は約0.05mlです。ブレンドは全体で4滴前後（約2%）を目安に。</p>';
  h+='<h3>取り入れ方</h3><ul class="steps">';t.u.forEach(function(x){h+='<li>'+esc(x)+'</li>'});h+='</ul>';
  if(t.x)h+='<p class="tip">'+esc(t.x)+'</p>';
  h+='<div class="sub"><b style="color:var(--main-d)">サブの香り：'+esc(s.n)+'</b><br><span style="color:var(--sub)">'+esc(s.o.map(function(o){return o[0]}).join('、'))+'</span><br><span style="color:var(--sub)">'+(gap?'メインとほぼ同じくらい、こちらの香りも今のあなたに合っています。気分で使い分けてみてください。':'気分や時間帯によって、こちらも取り入れてみてください。')+'</span></div>';
  h+='</div>';
  h+='<div class="warn"><b>安心してお使いいただくために</b>'+COMMON_CARE.map(function(c){return '<br>・'+esc(c)}).join('')+'</div>';
  h+='<div class="cta"><p>香りの選び方や使い方、あなたに合わせたケアのご相談は、<br>お気軽にDMやLINEでどうぞ。<br>この画面をスクショして送ってもらえるとスムーズです。</p>';
  if(CONTACT_URL)h+='<a class="btn" href="'+esc(CONTACT_URL)+'" target="_blank" rel="noopener">'+esc(CONTACT_LABEL)+'</a>';
  h+='<button class="btn ghost" id="re">もう一度診断する</button></div>';
  app.innerHTML=h; window.scrollTo(0,0);
  saveResult(keys[0]);
  document.getElementById("re").onclick=start;
}
